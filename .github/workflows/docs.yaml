name: build-docs

on:
  repository_dispatch:
    types: [build-docs]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit de JsonParserByLeo (vacio = rama principal)'
        required: false
        default: ''

#--- Pages: Settings > Pages > Source = GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_URL: https://forge.mql5.io/nique_372/JsonParserByLeo.git
  AWESOME_URL: https://github.com/jothepro/doxygen-awesome-css.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      #--- codigo de JsonParserByLeo (en el commit pedido)
      - name: Clonar JsonParserByLeo
        env:
          SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
        run: |
          git clone "$SOURCE_URL" src
          if [ -n "$SHA" ]; then git -C src checkout "$SHA"; fi
          echo "Fuente: $(git -C src rev-parse --short HEAD)"

      - name: Instalar Doxygen y Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      #--- el Doxyfile referencia el css con ruta relativa
      - name: Doxygen Awesome CSS
        run: git clone --depth 1 "$AWESOME_URL" src/doxygen-awesome-css

      - name: Generar documentacion
        working-directory: src
        run: |
          doxygen --version
          doxygen Doxyfile

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
